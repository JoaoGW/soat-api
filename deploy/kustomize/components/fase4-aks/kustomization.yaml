apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Fase 4 no AKS: Saga orquestrada pelo OS via Azure Service Bus com Workload
# Identity (SERVICE_BUS_CLIENT_ID seleciona a identidade de mensageria) e banco
# próprio da Saga (SAGA_DATABASE_URL vem do Key Vault pelo SecretProviderClass).
# O overlay kind não usa este componente: lá a Saga completa roda no workflow
# "Fluxo completo em Kubernetes", com o emulador do Service Bus.
patches:
  - path: deployment-patch.yaml
