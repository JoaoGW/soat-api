apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente completo para demonstração e aceite: os três serviços no Kubernetes
# (kind), cada um com o próprio banco, e os emuladores de Service Bus e Cosmos
# DB como serviços externos ao cluster. Os segredos são gerados pelo
# script scripts/kind/ambiente.sh e nunca ficam versionados.
namespace: soat-local

resources:
  - postgres.yaml
  - emuladores.yaml
  - mercado-pago-simulado.yaml
  - os.yaml
  - billing.yaml
  - execution.yaml

configMapGenerator:
  - name: mercado-pago-simulado
    files:
      - mercado-pago-simulado.cjs
  - name: os-postgres-init
    files:
      - 10-saga.sh=os-postgres-init.sh
    options:
      labels:
        app.kubernetes.io/component: database

generatorOptions:
  disableNameSuffixHash: true
