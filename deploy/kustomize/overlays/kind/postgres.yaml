apiVersion: v1
kind: ConfigMap
metadata:
  name: os-postgres-init
  labels:
    app.kubernetes.io/component: database
data:
  # O banco da Saga (Fase 4) é separado do banco legado no mesmo servidor.
  10-saga.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE DATABASE os_saga_kind"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-postgres
  labels:
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: os-postgres
  template:
    metadata:
      labels:
        app: os-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: os-postgres
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d os_saga_kind"]
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: os-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: os-postgres
  labels:
    app.kubernetes.io/component: database
spec:
  selector:
    app: os-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
