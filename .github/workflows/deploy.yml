name: Deploy imutável da API

on:
  workflow_dispatch:
  push:
    branches: [development, main]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/joaogw/soat-api

jobs:
  build_and_publish:
    name: Publicar imagem por SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
  deploy_hml:
    name: Deploy hml
    needs: build_and_publish
    if: github.ref_name == 'development'
    runs-on: ubuntu-latest
    environment: hml
    steps:
      - name: Verificar autorização de deploy
        id: gate
        run: |
          if [[ '${{ vars.TF_APPLY_ENABLED }}' == 'true' && -n '${{ vars.AZURE_CLIENT_ID }}' ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Deploy HML bloqueado pela trava de custo.'
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.deploy == 'true'
      - uses: azure/login@v2
        if: steps.gate.outputs.deploy == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1
        if: steps.gate.outputs.deploy == 'true'
        with:
          kubelogin-version: v0.1.4
      - uses: imranismail/setup-kustomize@v2
        if: steps.gate.outputs.deploy == 'true'
      - name: Autenticar no cluster AKS
        if: steps.gate.outputs.deploy == 'true'
        run: |
          az aks get-credentials \
            --resource-group '${{ vars.AKS_RESOURCE_GROUP }}' \
            --name '${{ vars.AKS_NAME }}' \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
      - name: Executar migrations antes do rollout
        if: steps.gate.outputs.deploy == 'true'
        env:
          ENVIRONMENT: hml
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          API_WORKLOAD_CLIENT_ID: ${{ vars.API_WORKLOAD_CLIENT_ID }}
          APP_VERSION: ${{ github.sha }}
        run: ./scripts/deploy-api.sh migration "$ENVIRONMENT" "$IMAGE"
      - name: Aplicar Deployment da API
        if: steps.gate.outputs.deploy == 'true'
        env:
          ENVIRONMENT: hml
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          API_WORKLOAD_CLIENT_ID: ${{ vars.API_WORKLOAD_CLIENT_ID }}
          APP_VERSION: ${{ github.sha }}
        run: ./scripts/deploy-api.sh application "$ENVIRONMENT" "$IMAGE"

  deploy_prod:
    name: Deploy prod
    needs: build_and_publish
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Verificar autorização de deploy
        id: gate
        run: |
          if [[ '${{ vars.TF_APPLY_ENABLED }}' == 'true' && -n '${{ vars.AZURE_CLIENT_ID }}' ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Deploy PROD bloqueado pela trava de custo.'
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.deploy == 'true'
      - uses: azure/login@v2
        if: steps.gate.outputs.deploy == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1
        if: steps.gate.outputs.deploy == 'true'
        with:
          kubelogin-version: v0.1.4
      - uses: imranismail/setup-kustomize@v2
        if: steps.gate.outputs.deploy == 'true'
      - name: Autenticar no cluster AKS
        if: steps.gate.outputs.deploy == 'true'
        run: |
          az aks get-credentials \
            --resource-group '${{ vars.AKS_RESOURCE_GROUP }}' \
            --name '${{ vars.AKS_NAME }}' \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
      - name: Executar migrations antes do rollout
        if: steps.gate.outputs.deploy == 'true'
        env:
          ENVIRONMENT: prod
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          API_WORKLOAD_CLIENT_ID: ${{ vars.API_WORKLOAD_CLIENT_ID }}
          APP_VERSION: ${{ github.sha }}
        run: ./scripts/deploy-api.sh migration "$ENVIRONMENT" "$IMAGE"
      - name: Aplicar Deployment da API
        if: steps.gate.outputs.deploy == 'true'
        env:
          ENVIRONMENT: prod
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          API_WORKLOAD_CLIENT_ID: ${{ vars.API_WORKLOAD_CLIENT_ID }}
          APP_VERSION: ${{ github.sha }}
        run: ./scripts/deploy-api.sh application "$ENVIRONMENT" "$IMAGE"
