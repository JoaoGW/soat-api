# Os emuladores rodam como containers na rede Docker do kind, como serviços
# gerenciados fora do cluster. O script cria os Endpoints com o IP de cada um.
apiVersion: v1
kind: Service
metadata:
  name: servicebus
  labels:
    app.kubernetes.io/component: emulator
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: cosmos
  labels:
    app.kubernetes.io/component: emulator
spec:
  ports:
    - name: gateway
      port: 8081
      targetPort: 8081
