apiVersion: apps/v1
kind: Deployment
metadata:
  name: soat-api
  labels:
    app.kubernetes.io/name: soat-api
    app.kubernetes.io/part-of: soat
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: soat-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soat-api
        app.kubernetes.io/part-of: soat
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: soat-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/joaogw/soat-api:sha-not-set
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: JWT_EXPIRES_IN
              value: 1d
            - name: JWT_CLIENT_ISSUER
              value: soat-auth-function
            - name: JWT_CLIENT_AUDIENCE
              value: soat-api
            - name: WEBHOOK_TOKEN_EXPIRES_IN
              value: 24h
          envFrom:
            - secretRef:
                name: soat-api-runtime
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: key-vault-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: key-vault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: soat-api-key-vault
