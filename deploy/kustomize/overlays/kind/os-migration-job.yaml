apiVersion: batch/v1
kind: Job
metadata:
  name: soat-os-migrate
  labels:
    app.kubernetes.io/name: soat-api
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: ghcr.io/joaogw/soat-api:sha-not-set
          command: ["npx", "prisma", "migrate", "deploy", "--schema", "prisma/os/schema.prisma"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: soat-api-runtime
                  key: SAGA_DATABASE_URL
