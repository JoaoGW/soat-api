apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente completo para demonstração e aceite: os três serviços no Kubernetes
# (kind), cada um com o próprio banco, e os emuladores de Service Bus e Cosmos
# DB como serviços externos ao cluster. Os segredos são gerados pelo
# script scripts/kind/ambiente.sh e nunca ficam versionados.
namespace: soat-local

resources:
  - postgres.yaml
  - emuladores.yaml
  - mercado-pago-simulado.yaml
  - os.yaml
  - billing.yaml
  - execution.yaml
  - observabilidade.yaml

configMapGenerator:
  - name: mercado-pago-simulado
    files:
      - mercado-pago-simulado.cjs
  - name: os-postgres-init
    files:
      - 10-saga.sh=os-postgres-init.sh
    options:
      labels:
        app.kubernetes.io/component: database

  - name: otel-collector
    files:
      - config.yaml=otel-collector.yaml
    options:
      labels:
        app.kubernetes.io/component: observability
  - name: prometheus
    files:
      - prometheus.yml
    options:
      labels:
        app.kubernetes.io/component: observability
  - name: grafana-datasources
    files:
      - datasources.yaml=grafana-datasources.yaml
    options:
      labels:
        app.kubernetes.io/component: observability
  - name: grafana-dashboards-provider
    files:
      - provider.yaml=grafana-dashboards-provider.yaml
    options:
      labels:
        app.kubernetes.io/component: observability
  - name: grafana-dashboards
    files:
      - soat-fase4.json=grafana-dashboard-soat.json
    options:
      labels:
        app.kubernetes.io/component: observability

generatorOptions:
  disableNameSuffixHash: true
